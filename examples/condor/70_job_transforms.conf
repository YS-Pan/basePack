# Single physical GPU: standard submit fields reserve the site's shared memory pool.
# Load after 60_resources.conf; the memory amount has one source there.
JOB_TRANSFORM_NAMES = $(JOB_TRANSFORM_NAMES) ReserveGPUMemory
JOB_TRANSFORM_ReserveGPUMemory @=end
    REQUIREMENTS JobUniverse == 5 && (RequestGPUs ?: 0) > 0
    EVALSET RequestGPUMemoryMiB ifThenElse(isUndefined(unresolved(GPUsMinMemory)), $(MACHINE_RESOURCE_GPUMemoryMiB), ceiling(GPUsMinMemory))
    SET Requirements ($(MY.Requirements:true)) && (TARGET.GPUMemoryMiB >= MY.RequestGPUMemoryMiB)
@end

# Validate the original standard attributes, independently of transform order.
# The schedd evaluates these with the explicit JOB and SCHEDD aliases.
# unresolved(attr) is undefined only when the attribute itself is absent.
SUBMIT_REQUIREMENT_NAMES = $(SUBMIT_REQUIREMENT_NAMES) SingleGPU PositiveGPUMemory GPUMemoryCapacity
SUBMIT_REQUIREMENT_SingleGPU = JOB.JobUniverse != 5 || isUndefined(unresolved(JOB.RequestGPUs)) || (isInteger(JOB.RequestGPUs) && (JOB.RequestGPUs == 0 || JOB.RequestGPUs == 1))
SUBMIT_REQUIREMENT_SingleGPU_REASON = "request_gpus must be 0 or 1 on this single-physical-GPU site; shared slots are not separate GPUs."
SUBMIT_REQUIREMENT_PositiveGPUMemory = JOB.JobUniverse != 5 || JOB.RequestGPUs =!= 1 || isUndefined(unresolved(JOB.GPUsMinMemory)) || (((isInteger(JOB.GPUsMinMemory) || isReal(JOB.GPUsMinMemory)) && JOB.GPUsMinMemory > 0) =?= true)
SUBMIT_REQUIREMENT_PositiveGPUMemory_REASON = "gpus_minimum_memory must resolve to a positive numeric MiB amount at submission (for example, 3000 MB); omit it to reserve the whole pool."
SUBMIT_REQUIREMENT_GPUMemoryCapacity = JOB.JobUniverse != 5 || JOB.RequestGPUs =!= 1 || isUndefined(unresolved(JOB.GPUsMinMemory)) || ((JOB.GPUsMinMemory <= $(MACHINE_RESOURCE_GPUMemoryMiB)) =?= true)
SUBMIT_REQUIREMENT_GPUMemoryCapacity_REASON = "gpus_minimum_memory exceeds this site's ordinary GPU memory pool ($(MACHINE_RESOURCE_GPUMemoryMiB) MiB)."
