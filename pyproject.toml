[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basepack"
version = "0.2.0"
description = "Project-local tools with shared embedding and HTCondor resources"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
embedding = ["torch==2.10.0", "torchvision==0.25.0", "transformers==5.22.1", "qwen-vl-utils==0.0.14", "accelerate>=1.15,<2", "Pillow>=13,<15"]
dev = ["pytest>=9", "build"]

[project.scripts]
basepack = "basepack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
basepack = ["templates/*", "embedding/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
