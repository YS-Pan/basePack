# Example for one 16380 MiB GPU; replace all four capacity values before deployment.
# Measure this machine's CPU/RAM needs and background GPU peak first (administrator.md).
# These sample numbers reserve 9216 MiB for background use, including embedding.
NUM_CPUS = 12
MEMORY = 24576
RESERVED_MEMORY = 0

use feature : GPUs
GPU_DISCOVERY_EXTRA = -extra -repeat 4
MACHINE_RESOURCE_GPUMemoryMiB = 7164
if defined MACHINE_RESOURCE_NAMES
  MACHINE_RESOURCE_NAMES = $(MACHINE_RESOURCE_NAMES), GPUMemoryMiB
endif

NUM_SLOTS = 1
NUM_SLOTS_TYPE_1 = 1
SLOT_TYPE_1 = 100%
SLOT_TYPE_1_PARTITIONABLE = TRUE

# Defense at the execution node, including clients outside this schedd.
START = ($(START)) && (((TARGET.RequestGPUs ?: 0) <= 0) || ((TARGET.RequestGPUMemoryMiB ?: 0) > 0))
