schema_version = 1

[embedding]
endpoint = 'http://127.0.0.1:8765'
service_name = 'BasepackEmbedding'
model_root = 'models/ORG/MODEL/REVISION'
device = 'auto'
batch_size = 4
max_pixels = 1048576
queue_timeout = 600
cpu_threads = 2
# CUDA soft target in MiB; adjust to the machine and measured workload. 0 disables cache trimming.
gpu_memory_mib = 9216

[htcondor]
bin_dir = 'C:/condor/bin'
config_file = 'C:/condor/condor_config'
# Optional slot-side interpreter. If omitted, jobs use the project's runtime.python.
# execute_python = '<path-to-Python-available-to-the-slot-account>'
