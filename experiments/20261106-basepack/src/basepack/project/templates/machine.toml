schema_version = 1

[shared]
state_dir = 'state/basepack'

[embedding]
endpoint = 'http://127.0.0.1:8765'
service_name = 'BasepackEmbedding'
model_root = 'models/ORG/MODEL/REVISION'
device = 'cuda:0'
max_length = 2048
batch_size = 4
max_pixels = 1048576
queue_timeout = 600
cpu_threads = 2
# Replace 0 with a measured positive budget in MiB before starting embedding.
gpu_memory_mib = 0

[htcondor]
bin_dir = 'C:/condor/bin'
config_file = 'C:/condor/condor_config'
