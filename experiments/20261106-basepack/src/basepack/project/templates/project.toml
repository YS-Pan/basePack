schema_version = 2

[runtime]
python = $python
machine_config = $machine_config

[project]
root = $root

[ai]
default_tier = 'tier3'
retrieval_tier = 'tier1'

[ai.tiers.tier1]
model = 'gpt-6-luna'
reasoning_effort = 'max'

[ai.tiers.tier2]
model = 'gpt-6.1-terra'
reasoning_effort = 'ultra'

[ai.tiers.tier3]
model = 'gpt-6.1-sol'
reasoning_effort = 'ultra'

[ai.tiers.tier4]
model = 'gpt-6-astra'
reasoning_effort = 'ultra'

[memory]
data_dir = '.basepack/memory'
# Retrieval mode: 'vector' or 'hybrid'; hybrid also supports --literal matching.
search_mode = 'vector'
project_id = '$memory_project_id'
# Run this project's authenticated server, bound only to this loopback IP.
endpoint = 'http://127.0.0.1:18080'
namespace = 'basepack'
database = 'memory'
username = 'root'
# Optional UTF-8 secret file, absolute or relative to the project root.
# Default: memory.data_dir/password.txt. Provision it before starting a new database.
# password_file = '.basepack/memory/password.txt'
# Git projects discover tracked and untracked nonignored files by default.
# Additional files/directories; also the discovery scope for projects without Git.
source_scope = []

[memory.codex]
# Host project binding; the collector reports missing metadata as a coverage gap.
project_id = $codex_project_id
other_project_roots = $codex_other_project_roots
registry_complete = $codex_registry_complete

[jobs]
jobs_dir = '.basepack/jobs'
