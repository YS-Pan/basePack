schema_version = 2

[runtime]
python = $python
machine_config = $machine_config

[project]
root = $root

[memory]
data_dir = '.basepack/memory'
project_id = '$memory_project_id'
# Run a separate local server for this project's data; choose its port here.
endpoint = 'http://127.0.0.1:18080'
namespace = 'basepack'
database = 'memory'
username = 'root'
password_env = 'BASEPACK_MEMORY_PASSWORD'

[jobs]
jobs_dir = '.basepack/jobs'
