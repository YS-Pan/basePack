schema_version = 2

[runtime]
python = $python
machine_config = $machine_config

[project]
root = $root

[ai]
default_tier = 'tier3'
retrieval_tier = 'tier1'

[ai.tiers.tier1]
model = 'gpt-6-luna'
reasoning_effort = 'max'

[ai.tiers.tier2]
model = 'gpt-6.1-terra'
reasoning_effort = 'ultra'

[ai.tiers.tier3]
model = 'gpt-6.1-sol'
reasoning_effort = 'ultra'

[ai.tiers.tier4]
model = 'gpt-6-astra'
reasoning_effort = 'ultra'

[memory]
data_dir = '.basepack/memory'
search_mode = 'text'
project_id = '$memory_project_id'
# Run a separate local server for this project's data; choose its port here.
endpoint = 'http://127.0.0.1:18080'
namespace = 'basepack'
database = 'memory'
username = 'root'
password_env = 'BASEPACK_MEMORY_PASSWORD'
# Optional secret file, absolute or relative to project root; otherwise data_dir/password.txt.
# password_file = '.basepack/memory/password.txt'
# Optional files/directories for discovering additions; otherwise check registered paths.
source_scope = []

[jobs]
jobs_dir = '.basepack/jobs'
