[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basepack"
version = "0.6.1"
description = "Project-local tools with shared embedding and HTCondor resources"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["psutil>=7.2,<8"]

[project.optional-dependencies]
embedding = ["sentence-transformers==6.2.0", "litserve==0.2.19", "torch==2.10.0", "torchvision==0.25.0", "transformers==5.22.1", "Pillow>=13,<15"]
dev = ["pytest>=9", "build"]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[project.scripts]
basepack = "basepack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
basepack = ["embedding/*.txt"]
"basepack.project" = ["templates/*"]
"basepack.memory" = ["*.surql", "SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
